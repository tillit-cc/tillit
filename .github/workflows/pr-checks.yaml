name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test --passWithNoTests

      # End-to-end device-auth + liveness against a real server booted in
      # PRODUCTION mode (migrations, NOT synchronize). This is the check that
      # catches entity↔migration schema drift — the class of bug that unit/e2e
      # jest (synchronize/mocks) cannot see. See scripts/e2e-device-auth.sh.
      - name: E2E device-auth + liveness (migration mode)
        run: bash scripts/e2e-device-auth.sh